name: Nomi
options:
  bundleIdPrefix: com.shivams07.nomi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  NomiCore:
    path: Packages/NomiCore
  NomiPreview:
    path: Packages/NomiPreview
  NomiIngest:
    path: Packages/NomiIngest
  NomiUI:
    path: Packages/NomiUI
  NomiApp:
    path: Packages/NomiApp

targets:
  Nomi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Nomi.entitlements"
    info:
      path: App/Info.plist
    entitlements:
      path: App/Nomi.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivams07.nomi
        PRODUCT_NAME: Nomi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: targeted
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: NomiApp
      - package: NomiCore
      - package: NomiIngest
      - package: NomiUI
      - package: NomiPreview

schemes:
  Nomi:
    build:
      targets:
        Nomi: all
    run:
      config: Debug
    test:
      config: Debug
