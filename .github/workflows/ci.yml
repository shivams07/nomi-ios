name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme Nomi \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test NomiCore
        run: cd Packages/NomiCore && swift test

      - name: Test NomiPreview
        run: cd Packages/NomiPreview && swift test

      - name: Test NomiIngest
        run: cd Packages/NomiIngest && swift test

      - name: Test NomiUI
        run: cd Packages/NomiUI && swift test

      - name: Test NomiApp
        run: cd Packages/NomiApp && swift test
